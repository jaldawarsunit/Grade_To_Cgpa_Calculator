<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CGPA / SGPA Calculator</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="container py-5">

    <h3 class="text-center mb-2 text-primary">
      MGM IT 2022-2026
    </h3>

    <p class="text-center text-muted mb-4">
      Advanced SGPA & CGPA Calculator
    </p>

    <!-- =====================================================
     SAVED STUDENTS
===================================================== -->

<div class="card shadow-lg p-4 mx-auto mb-4 student-card calculator-card">

  <h2 class="text-center text-primary mb-3">
    📚 Saved Students
  </h2>

  <label
    for="student"
    class="form-label"
  >
    Select Student
  </label>

  <select
    id="student"
    class="form-select"
  >

    <option value="">
      Select Student
    </option>

    <option value="Sunit">
      Sunit
    </option>

    <option value="Viraj">
      Viraj
    </option>

    <option value="Ekanth">
      Ekanth
    </option>

    <option value="Vaibhavi">
      Vaibhavi
    </option>

    <option value="Shwetha (DSY)">
      Shwetha (DSY)
    </option>

  </select>


  <!-- Saved student result appears here -->

  <div id="studentResult" class="mt-4"></div>

</div>

    <div class="card shadow-lg p-4 mx-auto calculator-card">

      <h1 class="text-center mb-4 text-primary">
        🎓 SGPA / CGPA Calculator
      </h1>

      <form id="cgpaForm">

        <!-- Calculation Type -->
        <div class="mb-3">
         

          <label for="semester" class="form-label">
            Select Calculation
          </label>

          <select id="semester" class="form-select">

            <option value="1">Semester 1 - SGPA</option>
            <option value="2">Semester 2 - SGPA</option>
            <option value="3">Semester 3 - SGPA</option>
            <option value="4">Semester 4 - SGPA</option>
            <option value="5">Semester 5 - SGPA</option>
            <option value="6">Semester 6 - SGPA</option>
            <option value="7">Semester 7 - SGPA</option>
            <option value="8">Semester 8 - SGPA</option>

            <option value="all">
              All Semesters - SGPA + CGPA Table
            </option>

            <option value="dall">
              DSY - Semester 3 to 8
            </option>

          </select>

        </div>

        <!-- Subjects -->
        <div id="subjects"></div>

        <!-- Calculate -->
        <button
          type="button"
          id="calculateBtn"
          class="btn btn-primary w-100 mt-3"
          onclick="calculateCGPA()"
        >
          Calculate
        </button>

      </form>

      <!-- Result -->
      <div id="result" class="mt-4"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
